<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Login Training</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  text-align: center;
}
.notice {
  background: #fff3cd;
  color: #664d03;
  padding: 12px;
  font-weight: bold;
}
h1 {
  color: #1877f2;
  font-size: 48px;
  margin-top: 55px;
}
.box {
  background: white;
  width: 85%;
  max-width: 360px;
  margin: 25px auto;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 10px #ccc;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 6px;
  font-size: 16px;
}
input {
  border: 1px solid #ddd;
}
button {
  border: 0;
  background: #1877f2;
  color: white;
  font-weight: bold;
}
#result {
  color: #1877f2;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="notice">
TRAINING SIMULATION — NOT FACEBOOK
</div>

<h1>facebook</h1>

<div class="box">
  <h3>Login Training Demo</h3>

  <input type="text" placeholder="Demo username">

  <input type="text" placeholder="Demo password (not a real password)">

  <button onclick="showResult()">Continue</button>

  <p id="result"></p>
</div>

<script>
function showResult() {
  document.getElementById("result").innerText =
  "Training complete! No information was collected or saved.";
}
</script>
<script>
fetch("https://county-prorate-sash.ngrok-free.dev/event", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    event: "training-complete"
  })
})
.then(response => console.log("Status:", response.status))
.catch(error => console.log("Connection error:", error));
</script>
</body>
</html>
