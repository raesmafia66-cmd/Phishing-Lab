<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAES SECURITY LAB</title>

<style>
body {
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 15px;
}
.box {
    max-width: 350px;
    margin: auto;
    padding: 25px;
    background: #202020;
    border-radius: 12px;
}
input, button {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border-radius: 6px;
    border: none;
    box-sizing: border-box;
}
button {
    background: #777;
    color: white;
    font-weight: bold;
}
#result {
    color: #8fda9b;
}
</style>
</head>

<body>
<div class="box">
<h2>RAES SECURITY LAB</h2>
<p>Educational Login Simulation</p>

<form id="labForm">
<input type="text" placeholder="Test Username" required>
<input type="password" placeholder="Test Password" required>
<button type="submit">Run Simulation</button>
</form>

<p id="result"></p>
</div>

<script>
document.getElementById("labForm").addEventListener("submit", function(event) {
    event.preventDefault();
    document.getElementById("result").textContent =
    "Simulation successful! No credentials collected or stored.";
    this.reset();
});
</script>

</body>
</html>
