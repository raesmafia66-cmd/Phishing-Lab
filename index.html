<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing Training Lab</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 30px;
}
.box {
  background: #202d40;
  padding: 25px;
  border-radius: 15px;
  max-width: 380px;
  margin: 40px auto;
}
input {
  padding: 12px;
  width: 85%;
  margin: 10px;
}
button {
  padding: 12px 25px;
  background: #16a085;
  color: white;
  border: none;
  border-radius: 6px;
}
#result {
  color: #70e0b0;
  margin-top: 20px;
}
</style>
</head>
<body>

<h1>Cybersecurity Training Lab</h1>

<div class="box">
<h2>Demo Login Page</h2>
<p>Educational simulation only</p>

<input type="text" placeholder="Demo username">
<br>
<input type="password" placeholder="Demo password">
<br>
<button onclick="showMessage()">Test Simulation</button>

<p id="result"></p>
</div>

<script>
function showMessage() {
  document.getElementById("result").innerHTML =
  "Training simulation! Never enter real passwords on suspicious pages.";
}
</script>

</body>
</html>
